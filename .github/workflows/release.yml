name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      blocking: ${{ steps.check.outputs.blocking }}
    steps:
      - name: Check for open security-labelled issues
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label security \
            --state open \
            --limit 100 \
            --json number \
            --jq 'length')
          echo "Open security-labelled issues: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            echo "::error::Release blocked: $COUNT open security-labelled issue(s). See SECURITY_AUDIT_CHECKLIST.md blocking findings."
            gh issue list \
              --repo "${{ github.repository }}" \
              --label security \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | "#\(.number) \(.title)"'
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: security-gate
    if: needs.security-gate.outputs.blocking == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM (release)
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Compute SHA256
        id: sha256
        run: |
          WASM_FILE="target/wasm32-unknown-unknown/release/stellar_wrap_contract.wasm"
          SHA=$(sha256sum "$WASM_FILE" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  stellar_wrap_contract.wasm" > stellar_wrap_contract.wasm.sha256

      - name: Reminder: update CHANGELOG before tagging
        run: echo "Reminder: update CHANGELOG.md with this version details before tagging." 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wasm32-unknown-unknown/release/stellar_wrap_contract.wasm
            stellar_wrap_contract.wasm.sha256
          body: |
            ## Release ${{ github.ref_name }}

            **WASM SHA256:** `${{ steps.sha256.outputs.sha256 }}`
