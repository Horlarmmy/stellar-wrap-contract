name: CI

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit
    - name: Run cargo audit
      run: cargo audit
    - name: Install cargo-deny
      uses: taiki-e/install-action@cargo-deny
    - name: Run cargo deny
      run: cargo deny check

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -C overflow-checks=on"
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy, rustfmt
    - name: Check format
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --workspace --all-targets
    - name: Check doc compilation
      run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
    - name: Run tests
      run: cargo test --workspace
    - name: Track WASM size budget
      run: ./scripts/check_wasm_size.sh
    - name: Check README documents all entrypoints
      run: python3 scripts/check_readme_entrypoints.py
    - name: Clean test snapshots
      run: rm -rf test_snapshots/

  fuzz:
    runs-on: ubuntu-latest
    # Fuzz targets are exercised on a schedule (see the `schedule` trigger)
    # and on demand, not on every push/PR, so a long-running fuzz session
    # never blocks the fast feedback loop.  Any crash it finds is committed
    # as a regression unit test under the owning crate's `tests/` directory.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-fuzz
      uses: taiki-e/install-action@cargo-fuzz
    - name: Fuzz bridge_wrap_in
      run: cargo fuzz run fuzz_bridge_wrap_in -- -max_total_time=300
    - name: Fuzz bridge_wrap_refund
      run: cargo fuzz run fuzz_bridge_wrap_refund -- -max_total_time=300
    - name: Fuzz merkle proof verification
      run: cargo fuzz run fuzz_merkle_proof -- -max_total_time=300
    - name: Fuzz signature payload decoder
      run: cargo fuzz run fuzz_signature_payload -- -max_total_time=300
    - name: Upload crashing inputs as regression artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: fuzz/artifacts/
        retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    # RUSTFLAGS intentionally avoids -D warnings but enables overflow-checks.
    # The test job sets "-D warnings" job-wide; tarpaulin instruments code
    # under its own cargo invocation and may emit warnings from proc-macros
    # or generated code that would otherwise fail CI.  Keeping this job free
    # of -D warnings isolates any tarpaulin-side noise from the test/lint gate.
    env:
      RUSTFLAGS: "-C overflow-checks=on"
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust (native only — no wasm32 target needed for tarpaulin)
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
        key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-tarpaulin-

    - name: Install cargo-tarpaulin
      run: |
        if ! command -v cargo-tarpaulin &>/dev/null; then
          cargo install cargo-tarpaulin --locked
        fi

    - name: Run coverage
      run: cargo tarpaulin --config tarpaulin.toml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage/cobertura.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload HTML coverage report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/tarpaulin-report.html
        retention-days: 30
