name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  release-gate:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run test suite
        run: npm test
      - name: Optimized build
        run: npm run build --if-present
      - name: Verify changelog updated against the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing; update it before releasing ${TAG}"
            exit 1
          fi
          if ! grep -qF "${TAG}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not mention ${TAG}; update the changelog against the tag"
            exit 1
          fi
          echo "Changelog references ${TAG}"
      - name: Verify release artifact hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -x scripts/verify-release-artifact.sh ]; then
            scripts/verify-release-artifact.sh "${TAG}"
          else
            echo "::warning::scripts/verify-release-artifact.sh not found; skipping artifact hash verification"
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo deny
        run: cargo deny check

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -C overflow-checks=on"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets
      - name: Check doc compilation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Run tests
        run: cargo test --workspace
      - name: Check every error variant is reachable and tested
        run: python3 scripts/check_error_variants.py
      - name: Track WASM size budget
        run: ./scripts/check_wasm_size.sh
      - name: Check README documents all entrypoints
        run: python3 scripts/check_readme_entrypoints.py
      - name: Clean test snapshots
        run: rm -rf test_snapshots/

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz
      - name: Fuzz bridge_wrap_in
        run: cargo fuzz run fuzz_bridge_wrap_in -- -max_total_time=300
      - name: Fuzz bridge_wrap_refund
        run: cargo fuzz run fuzz_bridge_wrap_refund -- -max_total_time=300
      - name: Fuzz merkle proof verification
        run: cargo fuzz run fuzz_merkle_proof -- -max_total_time=300
      - name: Fuzz signature payload decoder
        run: cargo fuzz run fuzz_signature_payload -- -max_total_time=300
      - name: Upload crashing inputs as regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          retention-days: 30

  reproducible-build-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build WASM in the pinned container
        run: |
          docker build -t wasm-build .
          docker run --rm -v "$PWD/out-a:/out" wasm-build
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-a
          path: out-a/*.wasm
          retention-days: 1

  reproducible-build-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build WASM in the pinned container
        run: |
          docker build -t wasm-build .
          docker run --rm -v "$PWD/out-b:/out" wasm-build
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-b
          path: out-b/*.wasm
          retention-days: 1

  reproducible-build-verify:
    runs-on: ubuntu-latest
    needs: [reproducible-build-a, reproducible-build-b]
    steps:
      - name: Download build A
        uses: actions/download-artifact@v4
        with:
          name: wasm-a
          path: out-a
      - name: Download build B
        uses: actions/download-artifact@v4
        with:
          name: wasm-b
          path: out-b
      - name: Compare WASM hashes
        run: |
          set -euo pipefail
          hash_a=$(sha256sum out-a/*.wasm | awk '{print $1}')
          hash_b=$(sha256sum out-b/*.wasm | awk '{print $1}')
          echo "build A: $hash_a"
          echo "build B: $hash_b"
          if [ "$hash_a" != "$hash_b" ]; then
            echo "::error::WASM builds are not reproducible: $hash_a != $hash_b"
            exit 1
          fi
          echo "WASM builds are reproducible: $hash_a"

  coverage:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C overflow-checks=on"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (native only — no wasm32 target needed for tarpaulin)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tarpaulin-
      - name: Install cargo-tarpaulin
        run: |
          if ! command -v cargo-tarpaulin &>/dev/null; then
            cargo install cargo-tarpaulin --locked
          fi
      - name: Run coverage
        run: cargo tarpaulin --config tarpaulin.toml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload HTML coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/tarpaulin-report.html
          retention-days: 30
